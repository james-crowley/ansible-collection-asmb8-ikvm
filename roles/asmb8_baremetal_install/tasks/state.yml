# Resumability core. A separate ansible-playbook invocation has no memory of a
# prior, interrupted run of this role, so that memory has to live somewhere
# durable: one small JSON file per target, keyed by asmb8_baremetal_install_host,
# on the controller. This mirrors media_session.py's own state-file pattern
# (one JSON file per session_id) for the same reason -- separate process
# invocations need a channel between them.
#
# What this file protects against: a run that armed a one-time boot selection
# and/or issued a reset, then got interrupted (Ctrl-C, controller crash,
# network partition) before confirming the outcome. asmb8_power's IPMI
# transitions are fire-and-forget once sent -- there is nothing to poll for
# after a reset/boot command (see asmb8_power's DOCUMENTATION) -- so a naive
# re-run that ignored this history could re-issue a reset against a machine
# whose first attempt may have already succeeded and is now mid-install.

- name: Ensure the run-state directory exists
  ansible.builtin.file:
    path: "{{ asmb8_baremetal_install_state_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Compute this target's run-state file path
  ansible.builtin.set_fact:
    asmb8_baremetal_install_state_file: >-
      {{ asmb8_baremetal_install_state_dir }}/{{ asmb8_baremetal_install_host
         | replace(':', '_') | replace('/', '_') }}.json

- name: Check whether a prior run left state behind
  ansible.builtin.stat:
    path: "{{ asmb8_baremetal_install_state_file }}"
  delegate_to: localhost
  register: asmb8_baremetal_install_state_stat

- name: Load prior run state
  ansible.builtin.include_vars:
    file: "{{ asmb8_baremetal_install_state_file }}"
    name: asmb8_baremetal_install_prior_state
  when: asmb8_baremetal_install_state_stat.stat.exists

- name: Default run state when no prior state file exists
  ansible.builtin.set_fact:
    asmb8_baremetal_install_prior_state: "{{ asmb8_baremetal_install_prior_state | default(asmb8_baremetal_install_default_state) }}"

- name: Start from a clean slate when the prior run fully completed
  ansible.builtin.set_fact:
    asmb8_baremetal_install_run_state: >-
      {{ asmb8_baremetal_install_default_state
         if (asmb8_baremetal_install_prior_state.reset_confirmed | default(false) | bool)
         else asmb8_baremetal_install_prior_state }}

- name: Refuse to silently resume past an uncertain boot/reset without operator acknowledgement
  ansible.builtin.assert:
    that:
      - asmb8_baremetal_install_force_resume | bool
    fail_msg: >-
      A prior run for {{ asmb8_baremetal_install_host }} left state indicating
      boot_armed={{ asmb8_baremetal_install_run_state.boot_armed }} and
      reset_issued={{ asmb8_baremetal_install_run_state.reset_issued }} with
      reset_confirmed={{ asmb8_baremetal_install_run_state.reset_confirmed }}
      (state file: {{ asmb8_baremetal_install_state_file }}). This role never
      silently re-issues a reset of uncertain outcome. Confirm the machine's
      actual boot state manually (KVM/physical console) first, then re-run with
      -e asmb8_baremetal_install_force_resume=true to proceed. If the machine is
      already confirmed installed and only needs its media detached, include this
      role's tasks/detach_media.yml directly rather than the whole role.
  when:
    - asmb8_baremetal_install_run_state.boot_armed | default(false) | bool
    - not (asmb8_baremetal_install_run_state.reset_confirmed | default(false) | bool)

- name: Clear armed/reset flags before an acknowledged resume attempt
  ansible.builtin.set_fact:
    asmb8_baremetal_install_run_state: >-
      {{ asmb8_baremetal_install_run_state | combine({'boot_armed': false, 'reset_issued': false}) }}
  when:
    - asmb8_baremetal_install_run_state.boot_armed | default(false) | bool
    - not (asmb8_baremetal_install_run_state.reset_confirmed | default(false) | bool)
    - asmb8_baremetal_install_force_resume | bool

- name: Persist the reconciled starting state
  ansible.builtin.include_tasks: save_state.yml
