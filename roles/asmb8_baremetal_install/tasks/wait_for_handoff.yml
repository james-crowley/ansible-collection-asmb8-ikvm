# Distinct from tasks/observe.yml: that phase confirms IPMI itself saw the
# machine power back on (BIOS/UEFI POST), well before any OS or installer
# environment would answer anything. This phase waits for whatever the freshly
# installed/booted environment answers on -- SSH by default, but point
# asmb8_baremetal_install_handoff_port at whatever is meaningful for your
# installer.
#
# Read defaults/main.yml's comment on asmb8_baremetal_install_handoff_timeout
# before treating a long wait here as a hang: this board streams the attached
# ISO at roughly 800 KB/s, so a real Proxmox install (614 MB squashfs alone) is
# 13+ minutes of streaming before the installer even starts running, and idle
# periods of well over a minute with zero media requests have been measured
# directly as normal, healthy behaviour.
#
# STOCK-ISO LIMITATION, stated again here because this is where it actually
# bites: a stock, unprepared installer ISO stops at a keypress-driven
# bootloader menu and never proceeds unattended (see
# asmb8_baremetal_install_iso_path's documentation in defaults/main.yml). If
# that is what was attached, this wait will run its full
# asmb8_baremetal_install_handoff_timeout and then fail -- correctly. That
# failure means "hand-off genuinely never happened", not "this task is broken".

- name: Wait for the installed/booted OS to answer, confirming hand-off
  ansible.builtin.wait_for:
    host: "{{ asmb8_baremetal_install_handoff_host }}"
    port: "{{ asmb8_baremetal_install_handoff_port }}"
    timeout: "{{ asmb8_baremetal_install_handoff_timeout }}"
    delay: "{{ asmb8_baremetal_install_handoff_delay }}"
  delegate_to: localhost
