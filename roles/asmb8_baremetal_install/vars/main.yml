# Internal constants, not caller-facing knobs -- those live in defaults/main.yml.
# vars/ has higher precedence than defaults/ specifically so a group_vars/host_vars
# override of a defaults/ variable can never accidentally shadow one of these.

# Fresh, unattached, unarmed run state. Used both for a target with no prior state
# file at all, and to reset state cleanly once a prior run's reset was confirmed
# complete (see tasks/state.yml) -- a fully finished prior run's session id refers
# to a session that has already been detached, so nothing in it is worth carrying
# forward.
#
# No action-token field here, unlike the sibling james_crowley.intel_amt
# collection's amt_baremetal_install role: amt_boot arms a one-time boot with a
# caller-supplied nonce specifically so re-arming is never mistaken for a no-op.
# asmb8_boot has no such concept -- it is a plain IPMI get_bootdev()/set_bootdev()
# compare, convergent like any other idempotent module (see its DOCUMENTATION).
# Re-running tasks/arm_boot.yml against a target whose boot-device override
# already reads back as optical/uefi is therefore genuinely a no-op
# (changed=false), not merely assumed safe. What this role still refuses to do
# unattended is the RESET that consumes that armed selection -- see
# asmb8_baremetal_install_force_resume below and tasks/state.yml.
asmb8_baremetal_install_default_state:
  media_attached: false
  session_id: null
  boot_armed: false
  reset_issued: false
  reset_confirmed: false
  detached: true
  last_failure: null
  # ipxe_http delivery mode only -- the session id of the ephemeral
  # asmb8_http_origin session this run started, claimed and persisted before
  # asmb8_bootstrap_image or asmb8_media can be attached against it, for the
  # same "always able to find it and stop it" reason session_id (above) is
  # claimed before asmb8_media's attach -- see tasks/prepare_ipxe_delivery.yml
  # and tasks/main.yml's `always` block. null for a full_iso run, always.
  ipxe_origin_session_id: null
