---
# ansible-core 2.17 is the floor, and the reason is specific: the sanity-test
# boilerplate requirement changed incompatibly at 2.17. From 2.17 onward the
# merged `boilerplate` test requires `from __future__ import annotations` and
# actively rejects the older `absolute_import, division, print_function` plus
# `__metaclass__ = type` pair that 2.16 and earlier require. No single form
# passes sanity on both eras, so supporting 2.16 would mean shipping modules
# that cannot be sanity-clean. We take 2.17 as the floor instead -- the same
# reasoning that sets the floor on the sibling james_crowley.intel_amt
# collection, because it is a property of ansible-core, not of AMT.
requires_ansible: '>=2.17.0'

action_groups:
  # Lets a play set shared connection options once via module_defaults:
  #
  #   module_defaults:
  #     group/james_crowley.asmb8_ikvm.asmb8_ikvm:
  #       host: "{{ asmb8_host }}"
  #       username: "{{ asmb8_username }}"
  #       password: "{{ asmb8_password }}"
  #
  # TODO: none of these five modules exist yet. This action group is written
  # ahead of them so the group name and membership are settled before the
  # first module lands, not discovered by trial and error afterwards.
  asmb8_ikvm:
    - asmb8_info
    - asmb8_power
    - asmb8_boot
    - asmb8_media
    - asmb8_redirection
