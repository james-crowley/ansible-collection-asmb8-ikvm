---
bugfixes:
  - >-
    ``asmb8_media`` - disable Nagle's algorithm (``TCP_NODELAY``) on the iUSB
    media socket. iUSB is strictly synchronous request/response, which is the
    traffic shape Nagle handles worst: each reply is written in a single
    ``sendall``, but its final partial segment is withheld pending an ACK that the
    peer delays, stalling once per read. Measured against real hardware before the
    change: 16,451 reads in 1800 seconds - 9.1 reads/second, roughly 109 ms each -
    against a BMC answering ICMP in about 5 ms. Since a full operating-system
    install needs on the order of 23,000 reads, that overhead alone accounted for
    tens of minutes. Python does not set this option by default.
