minor_changes:
  - Add ``asmb8_sel``, a read-only module that reads the BMC's System Event Log over the ``.asp``
    web interface (``getallselentries.asp``, ``getmaxselentries.asp``, ``getselcfg.asp``), with an
    optional ``limit`` on the number of entries returned. Documents that the same log is also
    readable over plain IPMI via ``pyghmi``'s ``get_event_log()`` (confirmed against the target
    hardware, same 24 entries) and that IPMI is generally the better choice; this module exists for
    web-management-only reachability and cross-checking, not to duplicate that path. Strictly
    read-only -- no ``clear`` option exists or is planned on this module, and the paged
    ``getselentries.asp`` (POST) endpoint is deliberately not used, since ``AspClient.get_webvar()``
    is GET-only by design.
