minor_changes:
  - >-
    asmb8_inventory - new read-only module for ``getfwinfo.asp``, ``getprojectcfg.asp``, and
    ``getfruinfo.asp``. Decodes ``getfwinfo.asp``'s ``FirmwareRevision2`` as BCD (``20`` decimal is
    ``0x14`` hex, i.e. "14", not "20") so ``firmware.firmware_version`` renders as ``1.14`` --
    matching this board's own "firmware 1.14, aux 1.14.2" as independently recorded in
    ``docs/protocol-notes.md`` and ``README.md`` -- and never as the wrong ``1.20``. Combines the
    three ``MfgID_*`` bytes into a little-endian manufacturer id without asserting which
    organisation it belongs to, since no sourced lookup for that value exists. Reports
    ``getprojectcfg.asp``'s full 42-entry ``FEATURES`` list verbatim (including its two real
    duplicates) alongside a deduplicated ``feature_set``, correcting an assumption in this module's
    original task brief that the fixture only carries one feature. Reports ``getfruinfo.asp``
    honestly as unpopulated on the target board (one of the corpus's five sentinel-only fixtures)
    rather than inventing a normalized shape with no populated sample to source it from. Added to
    ``meta/runtime.yml``'s ``asmb8_ikvm`` action group.
