---
minor_changes:
  - asmb8_alerts - add a new, read-only module that reads the ASMB8-iKVM BMC's alerting
    configuration (SMTP relay, LAN alert destinations, the IPMI PEF table, alert policies,
    email formatting, and per-policy last-triggered timestamps) over the C(.asp) web-management
    surface, grouped by what a caller wants to know rather than by endpoint name. Implements no
    writes -- see the module's own documentation for why changing alert destinations is
    deliberately out of scope for this release.
  - asmb8_auditlog - add a new, read-only module that reads the ASMB8-iKVM BMC's audit log
    entries and its logging configuration (remote/SD-card mirroring, syslog enablement and
    rotation, and the IPMI SEL overflow policy) over the C(.asp) web-management surface. Entries
    are returned verbatim and are documented as potentially containing usernames or addresses.
    Implements no writes -- clearing the audit log is deliberately out of scope for this release.
