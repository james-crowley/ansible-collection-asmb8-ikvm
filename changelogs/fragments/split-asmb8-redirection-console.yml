---
major_changes:
  - >-
    asmb8_redirection - rewritten before the first Galaxy release to actually match its name.
    It previously opened an IVTP console/KVM session (closer to what amt_media does in the
    sibling james_crowley.intel_amt collection than to what amt_redirection does); that
    implementation has moved, essentially unchanged, to the new asmb8_console module. The name
    asmb8_redirection now does what the sibling collection's amt_redirection does: report, and
    (once a real RPC is confirmed) toggle, whether this BMC's own listed services (web, kvm,
    cd-media, fd-media, hd-media, ssh, telnet) are enabled, separately from whether each one's
    TCP port is actually reachable right now. Without a ``state`` option it is read-only, exactly
    like the sibling module; any ``state`` request currently fails with
    ``error_class=unsupported_capability``, since no sourced RPC exists yet for toggling a
    service's enablement on this BMC (see the module's own DOCUMENTATION and
    docs/asmb8_redirection.md).
minor_changes:
  - >-
    asmb8_console - new module, carrying asmb8_redirection's former IVTP console/KVM-session
    implementation (handshake, ``capture=handshake_only|raw_frame|decoded_frame``) unchanged in
    behaviour. Added to ``meta/runtime.yml``'s ``asmb8_ikvm`` action group alongside the other
    five modules.
