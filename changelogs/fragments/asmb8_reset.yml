minor_changes:
  - >-
    asmb8_reset - new module for BMC cold/warm self-reset over IPMI (netfn ``0x06``
    cmd ``0x02``/``0x03``), promoting the documented manual ``ipmitool mc reset cold``
    recovery step to a first-class, testable module. Destructive-adjacent: drops every
    active BMC session, including any in-flight virtual-media session, though the host
    itself is unaffected (verified live: the host stayed powered on and never rebooted
    across a real cold reset). Supports full ``check_mode``, which never opens an IPMI
    connection at all -- a self-reset has no idempotent "previous state" to read. Added
    to ``meta/runtime.yml``'s ``asmb8_ikvm`` action group.
